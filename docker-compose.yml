services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:3307:3306'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DICTIONARY_SERVICE_URL: http://dictionary-service:8100
      DICTIONARY_SERVICE_ADMIN_PASSWORD: ${DICTIONARY_SERVICE_ADMIN_PASSWORD}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY:-}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dznwlaen6}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-thinkyGames}
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - '8080:80'
    depends_on:
      - backend

  backup:
    build: ./backup
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  dictionary-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DICTIONARY_DB}
      POSTGRES_USER: ${DICTIONARY_USER}
      POSTGRES_PASSWORD: ${DICTIONARY_PASSWORD}
    volumes:
      - dictionary_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  dictionary-service:
    build: ./dictionary-service
    environment:
      DATABASE_URL: postgresql+psycopg2://${DICTIONARY_USER}:${DICTIONARY_PASSWORD}@dictionary-db:5432/${DICTIONARY_DB}
      ADMIN_PASSWORD: ${DICTIONARY_SERVICE_ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_NAME: ${DICTIONARY_APP_NAME:-Dictionary Service}
      DEBUG: ${DICTIONARY_DEBUG:-false}
    depends_on:
      dictionary-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8100:8100'

volumes:
  mysql_data:
  dictionary_data:
